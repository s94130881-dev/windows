services:
  windows:
    image: ghcr.io/dockurr/windows:latest
    container_name: windows

    environment:
      VERSION: "10"
      RAM_SIZE: "12G"
      CPU_CORES: "16"
      DISK_SIZE: "100G"
      CPU_MODEL: "host"
      KVM: "Y"
      RAM_CHECK: "Y"

    devices:
      - /dev/kvm
      - /dev/net/tun

    cap_add:
      - NET_ADMIN

    ports:
      - "8006:8006"
      - "3389:3389/tcp"
      - "3389:3389/udp"

    volumes:
      - ./windows:/storage

    restart: unless-stopped
    stop_grace_period: 2m
